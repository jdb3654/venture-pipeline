name: Skills
on:
  pull_request:
    paths: ['.agents/skills/**', '.claude/skills/**', 'scripts/sync_skills.py', '.github/workflows/skills.yml']
  push:
    branches: [main]
    paths: ['.agents/skills/**', '.claude/skills/**', 'scripts/sync_skills.py', '.github/workflows/skills.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Claude and Codex skill copies match
        run: python3 scripts/sync_skills.py --check
      - name: Shell scripts parse
        run: for f in $(git ls-files '*.sh'); do bash -n "$f"; done
